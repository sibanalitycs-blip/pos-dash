<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>От глухой обороны к активной</title>
<style>
  :root{
    --bg:#fff; --ink:#16161a; --muted:#6b7280; --line:#e5e7eb; --soft:#fafafa;
    --acc:#d81b7a; --ok:#0f7b4f; --okbg:#e8f5ee; --bad:#b42318; --badbg:#fdecea;
    --new:#1d4ed8; --newbg:#e8eeff; --est:#8a6d00; --estbg:#fdf6e3; --vio:#7c3aed;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1140px;margin:0 auto;padding:0 20px 70px}

  /* табы */
  .tabs{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 0;padding:0 20px}
  .tabs .in{max-width:1140px;margin:0 auto;display:flex;gap:4px}
  .tab{appearance:none;border:none;background:none;cursor:pointer;font:inherit;
    padding:15px 16px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;font-size:13.5px}
  .tab[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc)}
  .tab .n{display:inline-block;width:19px;height:19px;border-radius:50%;background:#e5e7eb;color:#6b7280;
    font-size:11px;line-height:19px;text-align:center;margin-right:7px;font-weight:800}
  .tab[aria-selected="true"] .n{background:var(--acc);color:#fff}
  [role="tabpanel"][hidden]{display:none}

  .s{padding:38px 0 6px;border-top:1px solid var(--line)}
  .s.first{border-top:none;padding-top:30px}
  .num{display:inline-block;font-size:10.5px;letter-spacing:1.5px;color:var(--acc);
    font-weight:800;text-transform:uppercase;margin-bottom:7px}
  h1{font-size:29px;line-height:1.18;margin:0 0 8px;letter-spacing:-.5px}
  h2{font-size:20px;line-height:1.25;margin:0 0 12px;letter-spacing:-.3px}
  h3{font-size:12px;margin:20px 0 7px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
  p{margin:0 0 10px;max-width:74ch}
  .lead{font-size:16px;color:#374151;max-width:68ch}
  .note{font-size:12px;color:var(--muted);margin:7px 0 0;max-width:84ch}

  .hero{padding:36px 0 26px}
  .kick{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);font-weight:800}
  .date{color:var(--muted);font-size:12.5px;margin-top:12px}

  table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  thead th{background:var(--soft);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);border-bottom:2px solid var(--line);white-space:nowrap}
  td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  tr.tot td{border-top:2px solid var(--ink);font-weight:700;background:var(--soft)}
  tr.sub td{background:#fcfcfd;font-style:italic;color:var(--muted)}
  .up{color:var(--ok)} .dn{color:var(--bad)}

  .grid{display:grid;gap:11px;margin:12px 0}
  .g2{grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(205px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
  .card{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:#fff}
  .card .t{font-weight:700;margin-bottom:4px;font-size:13.5px}
  .card .d{font-size:12.5px;color:#4b5563}
  .card.acc{border-color:var(--acc);border-width:2px}
  .card.warn{border-color:#f0a5cd;background:#fffafc}
  .card .q{font-size:23px;font-weight:800;color:var(--acc);line-height:1;margin-bottom:7px}

  .kpi{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--soft)}
  .kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
  .kpi .d{font-size:11.5px;color:var(--muted);margin-top:3px}
  .kpi.red .v{color:var(--bad)} .kpi.grn .v{color:var(--ok)}

  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:800;white-space:nowrap}
  .t-new{color:var(--new);background:var(--newbg)} .t-ok{color:var(--ok);background:var(--okbg)}
  .t-bad{color:var(--bad);background:var(--badbg)} .t-est{color:var(--est);background:var(--estbg)}
  .t-flat{color:var(--muted);background:#f3f4f6}

  .then{display:flex;gap:11px;align-items:flex-start;margin:16px 0 2px;
    border-left:4px solid var(--acc);background:#fdf2f8;padding:11px 16px;border-radius:0 10px 10px 0}
  .then .ar{font-size:17px;color:var(--acc);font-weight:800;line-height:1.3}
  .then p{margin:0;font-size:14.5px;max-width:76ch}
  .then.red{background:var(--badbg);border-left-color:var(--bad)}
  .then.red .ar{color:var(--bad)}

  .form{background:var(--soft);border-left:3px solid var(--acc);padding:12px 16px;
    border-radius:0 8px 8px 0;margin:12px 0;font-size:14.5px}
  .form b{font-size:15.5px}
  .form .sm{display:block;font-size:12px;color:var(--muted);margin-top:6px}

  .band{display:flex;border-radius:7px;overflow:hidden;height:32px;margin:5px 0 3px;
    font-size:11px;font-weight:800;color:#fff}
  .band div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
  .c1{background:#d81b7a}.c2{background:#7c3aed}.c3{background:#0f7b4f}.c4{background:#b45309}.c0{background:#9ca3af}

  .bar{display:inline-block;height:9px;border-radius:2px;vertical-align:middle;margin-right:5px}
  .b22{background:#9ca3af}.b26{background:var(--acc)}.b28{background:#f5c518}

  ol.steps{counter-reset:st;list-style:none;padding:0;margin:12px 0}
  ol.steps li{counter-increment:st;position:relative;padding:0 0 12px 38px;font-size:13px}
  ol.steps li::before{content:counter(st);position:absolute;left:0;top:-1px;width:25px;height:25px;
    border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:12px;
    display:flex;align-items:center;justify-content:center}
  ol.steps li b{display:block;margin-bottom:1px}

  .phone{max-width:300px;border:1px solid var(--line);border-radius:18px;padding:13px;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .phone .pb{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:9px}
  .phone .tt{font-weight:800;font-size:14.5px}
  .phone .st{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
  .chk{width:18px;height:18px;border-radius:5px;flex:0 0 18px;display:flex;align-items:center;
    justify-content:center;font-size:11px;color:#fff;font-weight:800}
  .done{background:var(--ok)}.todo{background:#d1d5db}.warn2{background:var(--bad)}
  .row .sub{display:block;font-size:11px;color:var(--muted)}
  .prog{height:6px;border-radius:4px;background:#e5e7eb;overflow:hidden;margin:9px 0 3px}
  .prog i{display:block;height:100%;background:var(--ok)}

  svg{max-width:100%;height:auto}
  .src{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .src li{margin-bottom:4px}
  @media(max-width:640px){
    .wrap{padding:0 14px 44px} h1{font-size:22px} h2{font-size:17.5px} .s{padding-top:28px}
    th,td{padding:6px 8px} .tab{padding:13px 10px 10px;font-size:12.5px} .then p{font-size:13.5px}
  }

.legend .bar{height:10px;border-radius:2px;display:inline-block;margin-right:5px}

#lockScreen{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#lockScreen[hidden]{display:none}
#lockForm{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 24px;width:320px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}
#lockForm .lk-t{font-size:19px;font-weight:700}
#lockForm .lk-s{font-size:12.5px;color:var(--muted);margin:2px 0 16px}
#lockForm input{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;font-size:14px;margin-bottom:10px;font-family:inherit}
#lockForm button{width:100%;padding:10px;border:0;border-radius:7px;background:var(--acc);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
#lockForm button[disabled]{opacity:.6;cursor:default}
#lockForm .lk-e{margin-top:10px;font-size:12.5px;color:#a3242b}
#lockForm .lk-n{margin-top:14px;font-size:11px;line-height:1.45;color:var(--muted)}
</style>
</head>
<body>
<div id="lockScreen">
  <form id="lockForm" autocomplete="off">
    <div class="lk-t">Perfect Store</div>
    <div class="lk-s">Страница закрыта паролем</div>
    <input type="password" id="lockPass" placeholder="Пароль" autocomplete="current-password" inputmode="numeric" required>
    <button type="submit" id="lockBtn">Открыть</button>
    <div class="lk-e" id="lockErr" hidden>Пароль не подошёл</div>
    <div class="lk-n">Содержимое страницы зашифровано: без пароля его не прочитать даже в исходном коде.</div>
  </form>
</div>

<script>
(function(){
  const pl=document.getElementById('payload');
  const meta=JSON.parse(pl.dataset.meta);
  const b64=x=>{const s=atob(x),a=new Uint8Array(s.length);
    for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;};
  const cipher=b64(pl.textContent.trim());
  const scr=document.getElementById('lockScreen');
  const form=document.getElementById('lockForm'),inp=document.getElementById('lockPass'),
        btn=document.getElementById('lockBtn'),err=document.getElementById('lockErr');
  async function unlock(pass){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(meta.s),iterations:meta.n,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(meta.i)},key,cipher);
    const host=document.createElement('div');
    host.innerHTML=new TextDecoder().decode(pt);
    while(host.firstChild) document.body.appendChild(host.firstChild);
    pl.remove(); scr.remove();
  }
  let saved=null; try{saved=sessionStorage.getItem('ps-pass');}catch(e){}
  const tryQuiet=async()=>{ if(!saved) return false;
    try{ await unlock(saved); return true; }catch(e){ try{sessionStorage.removeItem('ps-pass');}catch(_){} return false; } };
  tryQuiet().then(ok=>{ if(ok) return;
    scr.hidden=false; inp.focus();
    form.onsubmit=async ev=>{
      ev.preventDefault(); err.hidden=true; btn.disabled=true; btn.textContent='Проверяю…';
      try{ await unlock(inp.value); try{sessionStorage.setItem('ps-pass',inp.value);}catch(e){} }
      catch(e){ err.hidden=false; btn.disabled=false; btn.textContent='Открыть'; inp.select(); }
    };
  });
})();
</script>
